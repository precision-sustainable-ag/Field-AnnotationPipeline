[project]
name = "field-annotation-pipeline"
version = "0.1.0"
description = "Barebones detection + segmentation annotation pipeline for field imagery: scans field_exploration.db for images needing annotation, stages them from long-term storage, runs inference, and writes cutouts + metadata back."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "torch>=2.5",
    "torchvision>=0.20",
    "segmentation-models-pytorch>=0.5",
    "timm>=1.0",
    "ultralytics>=8.3",
    "omegaconf>=2.3.1",
]

[project.scripts]
field-annotation = "field_annotation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/field_annotation"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Pinned to cu126 rather than uv's --torch-backend=auto: this host's GPU
# driver only supports up to CUDA 12.7, and auto-detection picked a cu130
# build that's too new for it, silently falling back to CPU.
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Hydra defaults and settings. Ignore these (don't change)
defaults:
  - paths: default
  - _self_

hydra:
  run:
    dir: ${paths.logdir}/${job.job_now}
  output_subdir: ${hydra.run.dir}/hydra

pipeline:
  # - find_unprocessed_batches
  # - download_batch
  - synch_from_remote
  - download_batch_id
  - build_metadata
  - classify_mat
  - detect_weeds
  - unet_segment_weeds
  - inspection

batch_id: AL_2023-08-25
download_batch:
  use_multithreading: True
  download_limit: 2

segment_weeds:
  multiprocess: False

inspection:
  num_random_images_to_inspect: 15

general:
  task: # Leave empty as placeholder

pipeline_keys: ${paths.workdir}/keys/authorized_keys.yaml

job:
  job_now_date: &nowdir ${now:%Y-%m-%d}
  job_now_time: ${now:%H_%M_%S}
  job_now: ${job.job_now_date}/${job.job_now_time} 
  jobdir: ${paths.datadir}/${job.job_now}

metadata_version: 1.0
